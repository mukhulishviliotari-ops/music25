<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playlists</title>
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="playlist.css">
</head>
<body>
  <div id="menu">
    <button id="hamburger" aria-label="Open menu">☰</button>
    <a href="https://musicplayer023.netlify.app/">home</a>
    <a href="playlist.html" class="active">playlists</a>
    <div class="InputContainer">
      <input id="playlist-search" placeholder="Search playlists & covers" class="input" name="text" type="search" autocomplete="off" />
    </div>
    <a href="index.html">discover</a>
    <a href="index.html">favorites</a>
  </div>

  <div class="main-content">
    <header class="page-header">
      <div>
        <h1>Your playlists</h1>
        <p>Drag the homepage card style into your playlist area. Search, create, and manage covers in a bigger, glassy layout.</p>
      </div>
      <div class="create-row">
        <div class="field-group">
          <label for="new-playlist">Playlist name</label>
          <input id="new-playlist" placeholder="Type playlist name" />
        </div>
        <button id="create-playlist">Create playlist</button>
      </div>
    </header>

    <section class="section-panel">
      <div class="section-heading">
        <h2>Playlists</h2>
        <span id="playlist-count"></span>
      </div>
      <div id="playlists-container" class="cards-grid"></div>
    </section>

    <section class="section-panel">
      <div class="section-heading">
        <h2>Liked Covers</h2>
      </div>
      <div id="liked-container" class="cards-grid"></div>
    </section>

    <section class="section-panel">
      <div class="section-heading">
        <h2>Recommendations</h2>
      </div>
      <div id="recommendations-container" class="cards-grid"></div>
    </section>
  </div>

  <script src="playlist.js"></script>
  <script src="covers.js"></script>
  <script>
    window.activeSearch = window.activeSearch || '';
    const searchInput = document.getElementById('playlist-search');
    if (searchInput) {
      searchInput.addEventListener('input', ({ target }) => {
        window.activeSearch = target.value.trim().toLowerCase();
        if (window.renderPlaylists) window.renderPlaylists();
        if (window.renderLiked) window.renderLiked();
        if (window.renderRecommendations) window.renderRecommendations();
      });
    }
    if (window.renderPlaylists) window.renderPlaylists();
    if (window.renderLiked) window.renderLiked();
    if (window.renderRecommendations) window.renderRecommendations();

    const hamb = document.getElementById('hamburger');
    if (hamb) {
      hamb.addEventListener('click', () => document.body.classList.toggle('menu-open'));
    }

    document.getElementById('create-playlist').addEventListener('click', () => {
      const name = document.getElementById('new-playlist').value.trim();
      if (!name) return showToast('Enter a name');
      createPlaylist(name);
      document.getElementById('new-playlist').value = '';
      showToast('Playlist created');
      if (window.renderPlaylists) window.renderPlaylists();
      if (window.renderLiked) window.renderLiked();
    });
  </script>
</body>
</html>
